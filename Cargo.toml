[package]
name = "climax"
version = "0.4.1"
edition = "2021"
description = "Monitor de cuota de Claude Code vía JSON hook + auto-resume, orquestado sobre herdr (sin scraping de UI, sin tmux)"
license = "MIT"
repository = "https://github.com/luismaf/climax"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true